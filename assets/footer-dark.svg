<svg xmlns="http://www.w3.org/2000/svg" width="860" height="92" viewBox="0 0 860 92" fill="none" role="img" aria-label="cyberneticx-sketch footer">
  <title>cyberneticx-sketch footer</title>
  <defs>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B06AB3"/>
      <stop offset="52%" stop-color="#7B6CE6"/>
      <stop offset="100%" stop-color="#4568DC"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#4568DC" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <clipPath id="footerClip">
      <rect x="1" y="1" width="858" height="90" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .wave { stroke-dasharray: 8 8; animation: flow 16s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -64; } }
    @media (prefers-reduced-motion: reduce) { .wave { animation: none !important; } }
  </style>

  <g clip-path="url(#footerClip)">
    <rect x="0" y="0" width="860" height="92" fill="#0D1117"/>
    <rect x="0" y="0" width="860" height="92" fill="url(#grid)"/>
    <path d="M 0 18 Q 215 4 430 18 T 860 18" stroke="url(#aurora)" stroke-opacity="0.45" stroke-width="1.2" fill="none" class="wave"/>
    <rect x="0" y="89" width="860" height="3" fill="url(#aurora)"/>
  </g>

  <rect x="1" y="1" width="858" height="90" rx="14" stroke="#2A3448" stroke-width="1.1"/>
  <path d="M 14 24 L 14 14 L 24 14" stroke="#B06AB3" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 836 14 L 846 14 L 846 24" stroke="#4568DC" stroke-width="1.4" stroke-linecap="round"/>

  <text x="430" y="44" text-anchor="middle" class="sans" font-size="14.5" font-weight="600" fill="#F0F6FC">Crafted with coffee, code &amp; curiosity</text>
  <text x="430" y="67" text-anchor="middle" class="mono" font-size="11.5" fill="#8B949E">
    <tspan fill="#67E8F9">@cyberneticx-sketch</tspan> · Let's sketch and build something sharp together
  </text>
</svg>
