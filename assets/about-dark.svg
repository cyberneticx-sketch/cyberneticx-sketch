<svg xmlns="http://www.w3.org/2000/svg" width="860" height="190" viewBox="0 0 860 190" fill="none" role="img" aria-label="About cyberneticx and current focus">
  <title>About cyberneticx and current focus</title>
  <defs>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B06AB3"/>
      <stop offset="52%" stop-color="#7B6CE6"/>
      <stop offset="100%" stop-color="#4568DC"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4568DC" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="858" height="188" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="860" height="190" fill="#131924"/>
    <rect x="0" y="0" width="860" height="190" fill="url(#grid)"/>
    <rect x="0" y="0" width="860" height="2.5" fill="url(#aurora)"/>
  </g>

  <rect x="1" y="1" width="858" height="188" rx="14" stroke="#2A3448" stroke-width="1.1"/>

  <!-- Left Column: Builder Manifesto -->
  <text x="32" y="34" class="mono" font-size="11" font-weight="600" letter-spacing="1.4" fill="#67E8F9">02 // ABOUT</text>
  <text x="32" y="64" class="sans" font-size="19" font-weight="700" fill="#F0F6FC">Crafting clean, responsive web interfaces.</text>

  <text x="32" y="92" class="sans" font-size="13.5" fill="#8B949E">Frontend developer focused on fast, accessible UI systems</text>
  <text x="32" y="113" class="sans" font-size="13.5" fill="#8B949E">with React, Next.js, and Tailwind CSS — backed by hands-on</text>
  <text x="32" y="134" class="sans" font-size="13.5" fill="#8B949E">full-stack fluency across Node.js, MongoDB, and MySQL.</text>

  <!-- Focus Pills -->
  <rect x="32" y="150" width="108" height="24" rx="6" fill="#0D1117" stroke="#2A3448" stroke-width="1"/>
  <text x="86" y="166" text-anchor="middle" class="mono" font-size="10.5" fill="#C9D1D9">UI Engineering</text>

  <rect x="148" y="150" width="114" height="24" rx="6" fill="#0D1117" stroke="#2A3448" stroke-width="1"/>
  <text x="205" y="166" text-anchor="middle" class="mono" font-size="10.5" fill="#C9D1D9">Design Systems</text>

  <rect x="270" y="150" width="128" height="24" rx="6" fill="#0D1117" stroke="#2A3448" stroke-width="1"/>
  <text x="334" y="166" text-anchor="middle" class="mono" font-size="10.5" fill="#C9D1D9">Full-Stack Apps</text>

  <!-- Vertical Panel Divider -->
  <line x1="482" y1="22" x2="482" y2="168" stroke="#2A3448" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Right Column: Live Spec / Current Focus -->
  <text x="510" y="34" class="mono" font-size="11" font-weight="600" letter-spacing="1.4" fill="#B06AB3">// CURRENT FOCUS</text>

  <!-- Row 1 -->
  <text x="510" y="64" class="mono" font-size="11" fill="#6E7681">ROLE</text>
  <text x="598" y="64" class="sans" font-size="13" font-weight="600" fill="#F0F6FC">Frontend Developer</text>
  <line x1="510" y1="77" x2="828" y2="77" stroke="#212B3B" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="510" y="99" class="mono" font-size="11" fill="#6E7681">PRIMARY</text>
  <text x="598" y="99" class="sans" font-size="13" fill="#C9D1D9">React · Next.js · Tailwind</text>
  <line x1="510" y1="112" x2="828" y2="112" stroke="#212B3B" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="510" y="134" class="mono" font-size="11" fill="#6E7681">BACKEND</text>
  <text x="598" y="134" class="sans" font-size="13" fill="#C9D1D9">Node.js · MongoDB · MySQL</text>
  <line x1="510" y1="147" x2="828" y2="147" stroke="#212B3B" stroke-width="1"/>

  <!-- Row 4 -->
  <text x="510" y="168" class="mono" font-size="11" fill="#6E7681">STATUS</text>
  <circle cx="603" cy="164" r="3.5" fill="#3FB950"/>
  <text x="614" y="168" class="sans" font-size="12.5" font-weight="600" fill="#3FB950">Open to freelance &amp; full-time</text>
</svg>
